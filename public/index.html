<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Node Deployment Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #222; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    #info { white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🚀 It's alive!</h1>
  <p>If you can see this page, your Node app is deployed and serving static files correctly.</p>
  <p>Try these endpoints:</p>
  <ul>
    <li><code>GET /health</code> — health check</li>
    <li><code>GET /api/info</code> — server info</li>
    <li><code>POST /api/echo</code> — echoes back JSON you send</li>
  </ul>
  <div id="info">Loading server info...</div>

  <script>
    fetch('/api/info')
      .then(r => r.json())
      .then(data => {
        document.getElementById('info').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('info').textContent = 'Could not reach /api/info: ' + err;
      });
  </script>
</body>
</html>
